<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fodus Baffo</title>
    
    <!-- Importa Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="screen-flash"></div>
    <div class="app-container">
        
        <!-- HEADER AGGIORNATO -->
        <header class="app-header">
            <h1>
                <span class="title-fodus">FODUS</span>
                <span class="title-baffo">BAFFO</span>
            </h1>
            <div id="countdown-pill" class="countdown-badge">Caricamento...</div>
        </header>

        <!-- VIEW 1: LOGIN PIN -->
        <section id="view-login" class="view active">
            <div class="card">
                <h2>Accesso Sfida</h2>
                <input type="password" id="pin-input" maxlength="4" placeholder="Inserisci PIN" pattern="\d*">
                <button id="btn-login" class="btn-primary">Entra</button>
                <p id="login-error" class="error-msg"></p>
            </div>
        </section>

        <!-- VIEW 2: ONBOARDING -->
        <section id="view-onboarding" class="view">
            <div class="card">
                <h2>Il tuo Nickname</h2>
                <input type="text" id="nickname-input" placeholder="Come ti chiamiamo?" maxlength="20">
                <button id="btn-save-nickname" class="btn-primary">Conferma</button>
            </div>
        </section>

        <!-- VIEW 3: HOME DASHBOARD -->
        <section id="view-home" class="view">
            <div class="dashboard-grid">
                <div class="stat-card">
                    <span class="stat-title">Stato di Oggi</span>
                    <h3 id="stat-photos-today" class="stat-value">0/4</h3>
                    <span class="stat-desc">Hanno fatto la foto</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">Avanzamento</span>
                    <h3 id="stat-days-passed" class="stat-value">Giorno 0</h3>
                    <div class="progress-bar-track">
                        <div id="progress-bar-fill" class="progress-bar-fill"></div>
                    </div>
                    <span class="stat-desc">su 115 giorni</span>
                </div>
            </div>

            <!-- BANNER ATTIVA NOTIFICHE (Visibile solo se mancano i permessi) -->
            <div id="notification-prompt" class="action-card hidden" style="background-color: var(--primary-light); border: 2px solid var(--primary); padding: 20px;">
                <h3 style="font-size: 1.2rem; color: var(--primary);">🔔 Attiva le Notifiche</h3>
                <p class="stat-desc" style="margin: 8px 0 16px 0;">Indispensabili per non farti scappare la foto quotidiana!</p>
                <button id="btn-enable-notif" class="btn-primary" style="padding: 12px; font-size: 1rem;">Consenti Notifiche</button>
            </div>

            <div class="action-card" id="home-action-card">
                <!-- Verrà popolato da JS con "Scatta" o "Hai già scattato" -->
            </div>

            <button id="btn-open-calendar" class="btn-secondary">📅 Guarda il Calendario</button>

            <div id="admin-controls" class="hidden" style="margin-top:20px;">
                <button id="btn-unlock-challenge" class="btn-admin">🚀 Admin: Inizia Sfida</button>
            </div>
        </section>

        <!-- VIEW 4: CAMERA (Corretta specchio e zoom) -->
        <section id="view-camera" class="view">
            <div class="camera-wrapper">
                <video id="camera-stream" autoplay playsinline muted></video>
                <canvas id="camera-canvas" class="hidden"></canvas>
                <div id="ghost-overlay" class="ghost-overlay"></div>
            </div>
            
            <div class="camera-actions">
                <button id="btn-capture" class="btn-shutter"></button>
                <div id="retake-actions" class="hidden">
                    <button id="btn-retake" class="btn-secondary">Rifai 🔄</button>
                    <button id="btn-upload" class="btn-primary">Invia 🚀</button>
                </div>
            </div>
            <button class="btn-text-only mt-3" onclick="checkStatus()">Annulla e torna alla Home</button>
        </section>

        <!-- VIEW 5: CALENDARIO -->
        <section id="view-calendar" class="view">
            <h2 class="section-title">Calendario Baffi 📸</h2>
            <div id="calendar-container" class="calendar-list">
                <!-- Popolato da JS -->
            </div>
            <button class="btn-secondary mt-3" onclick="checkStatus()">Torna alla Home</button>
        </section>

    </div>

    <script src="/static/js/app.js?v=8"></script>
    <div id="success-overlay" class="success-overlay hidden">
    <div class="success-check">✅</div>
    <div class="success-text">Inviata! 🎉</div>
</div>
</body>
</html>
